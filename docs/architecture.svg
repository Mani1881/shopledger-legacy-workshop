<svg width="1000" height="850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <!-- UI -->
  <rect x="425" y="20" width="150" height="40" fill="#f0f0f0" stroke="black"/>
  <text x="500" y="45" text-anchor="middle" font-family="sans-serif">UI (public/)</text>

  <!-- Server -->
  <rect x="425" y="100" width="150" height="40" fill="#e0e0ff" stroke="black"/>
  <text x="500" y="125" text-anchor="middle" font-family="sans-serif">server.js</text>

  <!-- Routes -->
  <rect x="50" y="180" width="150" height="40" fill="#fff0f0" stroke="black"/>
  <text x="125" y="205" text-anchor="middle" font-family="sans-serif">routes/customers.js</text>

  <rect x="250" y="180" width="150" height="40" fill="#fff0f0" stroke="black"/>
  <text x="325" y="205" text-anchor="middle" font-family="sans-serif">routes/orders.js</text>

  <rect x="450" y="180" width="150" height="40" fill="#fff0f0" stroke="black"/>
  <text x="525" y="205" text-anchor="middle" font-family="sans-serif">routes/products.js</text>

  <rect x="650" y="180" width="150" height="40" fill="#fff0f0" stroke="black"/>
  <text x="725" y="205" text-anchor="middle" font-family="sans-serif">routes/reports.js</text>

  <!-- Libs -->
  <rect x="50" y="300" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="100" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">coupons.js</text>

  <rect x="160" y="300" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="210" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">dates.js</text>

  <rect x="270" y="300" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="320" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">inventory.js</text>

  <rect x="380" y="300" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="430" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">invoice.js</text>

  <rect x="490" y="300" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="540" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">ledger.js</text>

  <rect x="600" y="300" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="650" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">orders.js</text>

  <rect x="710" y="300" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="760" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">pricing.js</text>

  <rect x="820" y="300" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="870" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">reports.js</text>

  <rect x="50" y="360" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="100" y="385" text-anchor="middle" font-family="sans-serif" font-size="12">store.js</text>

  <rect x="160" y="360" width="100" height="40" fill="#f0fff0" stroke="black"/>
  <text x="210" y="385" text-anchor="middle" font-family="sans-serif" font-size="12">tax.js</text>

  <!-- Config and Data -->
  <rect x="300" y="500" width="150" height="40" fill="#fff0e0" stroke="black"/>
  <text x="375" y="525" text-anchor="middle" font-family="sans-serif">config.js</text>

  <rect x="550" y="500" width="150" height="40" fill="#e0f0ff" stroke="black"/>
  <text x="625" y="525" text-anchor="middle" font-family="sans-serif">data/db.json</text>

  <!-- Arrows: Order Flow -->
  <line x1="500" y1="60" x2="500" y2="100" stroke="black" marker-end="url(#arrowhead)"/>
  <line x1="325" y1="140" x2="325" y2="180" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/> <!-- Server -> routes/orders.js -->
  <line x1="325" y1="220" x2="650" y2="300" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/> <!-- routes/orders.js -> lib/orders.js -->
  <line x1="650" y1="340" x2="100" y2="360" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/> <!-- lib/orders.js -> store.js -->
  <line x1="100" y1="400" x2="625" y2="500" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/> <!-- store.js -> db.json -->

  <!-- Other relations -->
  <line x1="375" y1="500" x2="320" y2="340" stroke="black" stroke-dasharray="4"/> <!-- config to lib -->
  <line x1="625" y1="500" x2="100" y2="400" stroke="black" stroke-dasharray="4"/> <!-- db to store -->

</svg>